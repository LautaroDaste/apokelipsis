<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>APOKÉLIPSIS SMP Participantes</title>
  <meta name="description" content="Lista de participantes del servidor APOKÉLIPSIS SMP.">
  <meta property="og:title" content="APOKÉLIPSIS SMP Participantes">
  <meta property="og:description" content="Mirá quiénes están invitados al servidor.">
  <meta property="og:image" content="assets/icon.png">
  <meta name="theme-color" content="#120f1d">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero wrap">
    <img class="logo" src="assets/logo.png" alt="APOKÉLIPSIS SMP">
    <h1>Participantes</h1>
  </header>

  <main class="wrap">
    <div class="stats">
      <div class="stat" data-k="all"><span class="n" id="c-all">–</span><span class="l">Invitados</span></div>
      <div class="stat" data-k="CONFIRMADO"><span class="n" id="c-CONFIRMADO">–</span><span class="l">Confirmados</span></div>
      <div class="stat" data-k="PENDIENTE"><span class="n" id="c-PENDIENTE">–</span><span class="l">Pendientes</span></div>
      <div class="stat" data-k="RECHAZADO"><span class="n" id="c-RECHAZADO">–</span><span class="l">Rechazados</span></div>
    </div>

    <section class="grid" id="grid" aria-live="polite">
      <div class="empty">Cargando participantes…</div>
    </section>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
