<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>APOKÉLIPSIS SMP Participantes</title>
  <meta name="description" content="Lista de participantes del servidor APOKÉLIPSIS SMP.">
  <meta property="og:title" content="APOKÉLIPSIS SMP Participantes">
  <meta property="og:description" content="Mirá quiénes están invitados al servidor.">
  <meta property="og:image" content="assets/icon.png">
  <meta name="theme-color" content="#120f1d">
  <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/icon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="hero wrap">
    <img class="logo" src="assets/logo.png" alt="APOKÉLIPSIS SMP">
    <h1>Participantes</h1>
    <p>Estos son los invitados al servidor y el estado de su invitación.</p>
  </header>

  <main class="wrap">
    <div class="stats" role="tablist" aria-label="Filtrar por estado">
      <button class="stat active" data-filter="all" role="tab"><span class="n" id="c-all">–</span><span class="l">Invitados</span></button>
      <button class="stat" data-filter="CONFIRMADO" role="tab"><span class="n" id="c-CONFIRMADO">–</span><span class="l">Confirmados</span></button>
      <button class="stat" data-filter="PENDIENTE" role="tab"><span class="n" id="c-PENDIENTE">–</span><span class="l">Pendientes</span></button>
      <button class="stat" data-filter="RECHAZADO" role="tab"><span class="n" id="c-RECHAZADO">–</span><span class="l">Rechazados</span></button>
    </div>

    <label class="search">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Buscar participante…" autocomplete="off" aria-label="Buscar participante">
    </label>

    <section class="grid" id="grid" aria-live="polite">
      <div class="empty">Cargando participantes…</div>
    </section>
  </main>

  <footer>APOKÉLIPSIS SMP · Lista actualizada automáticamente</footer>

  <script src="assets/app.js"></script>
</body>
</html>
